<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus booking system</title>
</head>

<body>

    <div style="background-color: blueviolet; border:2px solid black; height: 600px; width: 400px; color:#fff">
        <center>
            <img src="./image.png" style="height: 50px;">
            <h1>Bus Booking System</h1>
        </center>

        <h3>User information</h3>

        <p>User Name:<input type="text" id="name"></p>
        <p>User Age:<input type="text" id="age"></p>
        <p>Aadhar No:<input type="text" id="aadhar"></p>

        <p>Select Your City :
            <select id="city">
                <option>GZB</option>
                <option>Delhi</option>
                <option>Kanpur</option>
                <option>Goa</option>
                <option>Bihar</option>
            </select>
        </p>

        <p>Choose your travelling date:
            <input type="date" id="date">
        </p>

        <h3>Bus information</h3>

        <p>Select Your bus type</p>

        <p>AC Bus: 2000
            <input type="radio" name="bus" value="2000">
        </p>

        <p>Non AC Bus: 1000
            <input type="radio" name="bus" value="1000">
        </p>

        <p>Select Your Seat
            <select id="seat">
                <option>1</option>
                <option>2</option>
                <option>3</option>
            </select>
        </p>

        <button onclick="showDetails()" id="btn">Click To Submit</button>
    </div>

    <script>
        function showDetails() {

            let name = document.getElementById("name").value;
            let age = document.getElementById("age").value;
            let aadhar = document.getElementById("aadhar").value;
            let city = document.getElementById("city").value;
            let date = document.getElementById("date").value;
            let seat = Number(document.getElementById("seat").value);

            let bus = document.querySelector('input[name="bus"]:checked');

            if (bus == null) {
                alert("Please select bus type");
                return;
            }

            let busPrice = Number(bus.value);

            let total = seat * busPrice;

            alert(
                "Bus Booking Details\n\n" +
                "Name: " + name + "\n" +
                "Age: " + age + "\n" +
                "Aadhar: " + aadhar + "\n" +
                "City: " + city + "\n" +
                "Date: " + date + "\n" +
                "Bus Price: ₹" + busPrice + "\n" +
                "Seats: " + seat + "\n" +
                "Total: ₹" + total
            );
        }

        const btn = document.getElementById("btn");
        btn.addEventListener('click', () => {
            showDetails();
        })
    </script>

</body>

</html>
