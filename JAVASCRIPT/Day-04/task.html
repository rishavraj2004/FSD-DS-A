<body>
    <script>
        const student = {
            Btech: {
                student1: { name: "User1", branch: "DS", year: 3 },
                student2: { name: "User2", branch: "IT", year: 2 }
            }
        };

        const ask = prompt("Give ans (e.g., DS or IT)");
        const { Btech } = student;

        const studentArray = [...Object.values(Btech)];

        const ans = studentArray.filter((i) => {
            return i.branch === ask;
        });

        console.log(ans);


    </script>
